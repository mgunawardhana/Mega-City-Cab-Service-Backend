# Application name for the Spring Boot application
spring.application.name=mega-city-cab-service-backend

# Server port on which the application will run
server.port=8080

# HikariCP Connection Pool Settings
# Minimum number of idle connections maintained in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum number of connections allowed in the pool
spring.datasource.hikari.maximum-pool-size=20
# Time (in milliseconds) a connection can remain idle before being closed
spring.datasource.hikari.idle-timeout=30000
# Name of the Hikari connection pool
spring.datasource.hikari.pool-name=HikariPool-1
# Maximum lifetime (in milliseconds) of a connection in the pool
spring.datasource.hikari.max-lifetime=2000000
# Timeout (in milliseconds) for establishing a database connection
spring.datasource.hikari.connection-timeout=30000
# Threshold (in milliseconds) for detecting connection leaks
spring.datasource.hikari.leak-detection-threshold=15000

# JPA and Database Configuration
# Specifies the database type for JPA
spring.jpa.database=POSTGRESQL
# Hibernate dialect for PostgreSQL database
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Read-Only Database Configuration
# URL for the read database, defaults to local PostgreSQL instance if not overridden by environment variable
spring.datasource.read.url=${DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/megaCityCabService}
# Username for the read database, defaults to 'postgres' if not overridden
spring.datasource.read.username=${DB_USER:postgres}
# Password for the read database, defaults to 'pgadmin' if not overridden
spring.datasource.read.password=${DB_PASSWORD:pgadmin}
# Driver class for PostgreSQL database
spring.datasource.read.driver-class-name=org.postgresql.Driver

# Write-Only Database Configuration
# URL for the write database, defaults to local PostgreSQL instance if not overridden by environment variable
spring.datasource.write.url=${DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/megaCityCabService}
# Username for the write database, defaults to 'postgres' if not overridden
spring.datasource.write.username=${DB_USER:postgres}
# Password for the write database, defaults to 'pgadmin' if not overridden
spring.datasource.write.password=${DB_PASSWORD:pgadmin}
# Driver class for PostgreSQL database
spring.datasource.write.driver-class-name=org.postgresql.Driver

# Logging Configuration
# Logs SQL parameter binding at TRACE level
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Logs SQL result extraction at TRACE level
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE
# Logs SQL statements at TRACE level
logging.level.org.hibernate.SQL=TRACE

# Database Backup Settings
# Directory where database backups are stored
backup.directory=./resources
# Number of days to retain backup files
backup.retention-days=1

# Multipart File Upload Settings
# Maximum size allowed for uploaded files
spring.servlet.multipart.max-file-size=25MB
# Maximum size allowed for multipart/form-data requests
spring.servlet.multipart.max-request-size=25MB

# JWT Authentication Configuration
# Secret key for signing JWT tokens, defaults to a predefined value if not overridden
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration time for JWT tokens in milliseconds (default: 24 hours)
application.security.jwt.expiration=${JWT_EXPIRY:86400000}
# Expiration time for JWT refresh tokens in milliseconds (default: 24 hours)
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRY:86400000}

