name: Deploy to GitHub Actions

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest

  deploy:
    needs: build
    runs-on: self-hosted  # Changed from [aws-ec2] to self-hosted runner
    steps:
      - name: Pull Image from Docker Hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest

      - name: Delete Old Container
        run: docker rm -f mega-city-cab-service-backend || true  # Added || true to prevent failure if container doesn't exist

      - name: Run Docker Container
        run: docker run -d -p 8080:8080 --name mega-city-cab-service-backend ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest
