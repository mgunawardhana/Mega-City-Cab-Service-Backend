name: Deploy to Github Actions
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Maven
        run: mvn clean install -DskipTests
      - name: Log into Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Docker Build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend .
      - name: Publishing Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest
  
  deploy:
    needs: build
    runs-on: [self-hosted, aws-ec2]
    steps:
      - name: Install Docker if not present
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found, installing..."
            sudo apt-get update
            sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
            sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            sudo usermod -aG docker $USER
            echo "Docker installed successfully"
          else
            echo "Docker is already installed"
          fi
      - name: Pull Image from docker hub
        run: sudo docker pull ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest
      - name: Delete old container if exists
        run: |
          if sudo docker ps -a | grep -q mega-city-cab-service-backend; then
            sudo docker rm -f mega-city-cab-service-backend
          else
            echo "No existing container to remove"
          fi
      - name: Run docker container
        run: sudo docker run -d -p 8080:8080 --name mega-city-cab-service-backend ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest
