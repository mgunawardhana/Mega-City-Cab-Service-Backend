name: Deploy to Github Actions

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Log into Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker Build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend .

      - name: Publishing Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest
  
  deploy:
    needs: build
    runs-on: [ aws-ec2 ]
    steps:
      - name: Pull Image from docker hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend:latest
      - name: Delete old container
        run: docker rm -f mega-city-cab-service-backend
      - name: Run docker container
        run: docker run -d -p 8080:8080 --name mega-city-cab-service-backend ${{ secrets.DOCKER_USERNAME }}/mega-city-cab-service-backend
