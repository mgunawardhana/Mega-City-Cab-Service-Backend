apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mega-city-cab-service-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mega-city-cab-service-backend
  minReplicas: 500
  maxReplicas: 10000
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale up when CPU usage exceeds 70%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # Fast scale-up (30 seconds)
      policies:
        - type: Pods
          value: 500  # Add 500 pods at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # Slower scale-down (5 minutes)